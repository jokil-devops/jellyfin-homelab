services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped

    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"

    volumes: 
      - ./config:/config
      - ./cache:/cache
      - ./films:/media/movies:ro
      - ./series:/media/series:ro



